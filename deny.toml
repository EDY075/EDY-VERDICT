# Windows is the only validated target. Full Cargo.lock advisories are also retained.
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
